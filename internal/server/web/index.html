<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skill-review</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1 id="skill-name">skill-review</h1>
      <code id="skill-path"></code>
      <button id="submit-all" type="button">Submit all</button>
    </header>

    <main>
      <article id="doc" aria-label="Skill under review"></article>

      <aside>
        <form id="composer" hidden>
          <h2>New comment</h2>
          <blockquote id="composer-quote"></blockquote>

          <label for="composer-body">Comment</label>
          <textarea id="composer-body" rows="4" required
            placeholder="What should change, and why?"></textarea>

          <div class="row">
            <button type="submit">Save comment</button>
            <button type="button" id="composer-cancel" class="quiet">Cancel</button>
          </div>
        </form>

        <p id="empty" class="hint">Highlight a passage in the document, then choose Comment.</p>
        <div id="threads"></div>
      </aside>
    </main>

    <div id="selection-menu" role="toolbar" aria-label="Selection actions" hidden>
      <button type="button" id="selection-comment" aria-label="Comment on selection">💬 Comment</button>
    </div>

    <div id="handoff" role="status" aria-live="polite" hidden>
      <p id="handoff-summary"></p>
      <pre id="handoff-prompt"></pre>
      <div class="row">
        <button type="button" id="handoff-copy">Copy prompt</button>
        <button type="button" id="handoff-close" class="quiet">Close</button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
